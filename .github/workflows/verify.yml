name: Verify
on:
  pull_request:
    # Run CI on every PR regardless of its base branch, so stacked PRs
    # (e.g. docs/** or refactor/** targeting another feature branch) are verified too.
  push:
    branches: [develop, main, 'feature/**', 'fix/**', 'chore/**', 'docs/**', 'refactor/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
        if: ${{ !cancelled() }}
      - run: git diff --check
        if: ${{ !cancelled() }}
